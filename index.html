<style>

font-size:12px}.demo{background:#fff6e2;border-bottom:1px solid #f3e9c8;color:#856520;padding:10px 35px;font-size:12px}.content{padding:31px 35px 48px;display:flex;flex-direction:column;gap:23px;max-width:1550px;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:15px}.pagehead h1{margin:0;font-size:26px;letter-spacing:-.8px}.pagehead p{font-size:13px;color:#82949b;margin:8px 0 0}.btn{border:1px solid #d9e5e7;border-radius:8px;background:#fff;color:#344c55;padding:10px 14px;font-weight:700;font-size:12px;white-space:nowrap}.btn:hover{filter:brightness(.97)}.btn.primary{color:#fff;background:#0c947f;border-color:#0c947f}.btn.soft{background:#e9f6f1;color:#0a8b77;border-color:#e9f6f1}.field{background:#fff;border:1px solid #d8e4e6;border-radius:8px;padding:10px 12px;color:#243b42;font-size:12px;min-width:0;max-width:100%}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat,.panel{background:#fff;border:1px solid #e3ebed;border-radius:12px;overflow:hidden}.stat{padding:19px}.stat-top{font-size:12px;color:#758a91;display:flex;justify-content:space-between;align-items:center}.stat-icon{background:#e9f6f2;color:#078d7b;border-radius:9px;padding:8px;font-size:18px}.stat-value{font-size:29px;font-weight:850;letter-spacing:-1px;margin-top:14px}.stat-caption{font-size:11px;color:#82949b;margin-top:3px}.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(255px,1fr);gap:17px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px 21px;border-bottom:1px solid #e9eff0;gap:12px}.panel-title{font-weight:800;font-size:14px}.panel-sub{color:#90a0a5;font-size:11px;margin-top:5px}.link{color:#088d7a;background:none;border:0;font-weight:750;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;background:#fafcfc;color:#8b9ba0;font-weight:750;font-size:10px;text-transform:uppercase;letter-spacing:.4px}td,th{padding:14px 17px}td{border-top:1px solid #eff2f3}.strong{font-weight:750}.sub{font-size:10px;color:#95a4a8;margin-top:4px}.pill{border-radius:30px;display:inline-block;padding:6px 10px;font-size:10px;font-weight:750;background:#eaf2f3;color:#56747e}.pill.Waiting{background:#fff0ce;color:#987011}.pill.Confirmed{background:#e5f6ee;color:#16835c}.pill.Done{background:#e9f0ec;color:#58826e}.pill.Consulting{background:#e7edff;color:#4769aa}.queue-item{padding:18px 19px;display:flex;align-items:center;gap:12px;border-top:1px solid #edf1f1}.qnum{background:#f3f7f7;border-radius:9px;padding:10px;font-size:11px;font-weight:800;color:#647c83}.qmain{min-width:0;flex:1}.qname{font-size:12px;font-weight:750}.qsub{font-size:11px;color:#90a0a5;margin-top:4px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar .field.search{width:330px;max-width:100%}.padded{padding:21px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.label{display:block;font-size:11px;color:#72878e;margin-bottom:6px;font-weight:700}.grid2 .field{width:100%}textarea.field{width:100%;min-height:87px;resize:vertical}.mini{display:inline-block;padding:8px 10px;border-radius:7px;background:#f2f8f7;font-size:11px;margin:5px 6px 0 0}.modalwrap{position:fixed;inset:0;background:#15343d85;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:15px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:27px;box-shadow:0 15px 65px #102b3c30}.modalhead{font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;right:24px;bottom:24px;background:#075e52;color:#fff;padding:13px 18px;border-radius:9px;box-shadow:0 7px 20px #0002;z-index:30;font-size:12px}.empty{padding:30px;color:#8a9ca2;text-align:center}.back{color:#0c917c;border:0;background:none;font-size:12px;font-weight:750;padding:0}.section-title{font-size:13px;font-weight:800;margin:18px 0 10px}.muted{color:#83979c}.mobile-nav{display:none}

@media(max-width:950px){.app{grid-template-columns:70px minmax(0,1fr)}.sidebar{padding:18px 8px}.brand{padding:0 6px 22px}.brand-name,.brand-note,.navlabel,.navhead,.sidefoot{display:none}.nav{justify-content:center;padding:13px 5px}.header{padding:15px 19px}.content{padding:22px 18px}.demo{padding:10px 18px}}

</style></head><body>
<div class="app" id="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">✚</div><div><div class="brand-name">Clinic<em>OS</em></div><div class="brand-note">CLINIC MANAGEMENT</div></div></div><div class="navhead">WORKSPACE</div><div id="nav"></div><div class="sidefoot"><span class="dot"></span>Demo environment<br>v0.1 · Synthetic data</div></aside><div class="main"><div class="header"><div><div class="crumb">ClinicOS / <span id="crumb"></span></div><div class="headtitle" id="top-title"></div></div><div class="headright"><select id="branch" class="field"><option value="main">Riyadh Main</option><option value="north">Riyadh North</option></select><button class="btn" id="lang">العربية</button><div class="initials">AD</div></div></div><div class="demo" id="banner">◉ Prototype · All patients and transactions are fictional · No backend or authentication</div><div id="screen" class="content"></div></div></div><div id="modalroot"></div><div id="toastroot"></div>
<script>
(function(){
'use strict';
var state={page:'dashboard',branch:'main',language:'en',selected:null,search:''};
var doctors=[{id:1,name:'Dr. Amal Nasser',specialty:'General Practice · Pediatrics',branch:'main'},{id:2,name:'Dr. Khalid Omar',specialty:'Dental',branch:'main'},{id:3,name:'Dr. Reem Fahad',specialty:'Dermatology',branch:'north'}];
var patients=[{id:1,mrn:'MRN-0001',name:'Sara Al-Otaibi',ar:'سارة العتيبي',age:32,mobile:'+966550001001',insurance:'Bupa Arabia',branch:'main'},{id:2,mrn:'MRN-0002',name:'Omar Faris',ar:'عمر فارس',age:45,mobile:'+966550001002',insurance:'Tawuniya',branch:'main'},{id:3,mrn:'MRN-0003',name:'Lina Hassan',ar:'لينا حسن',age:8,mobile:'+966550001003',insurance:'Self-pay',branch:'main'},{id:4,mrn:'MRN-0004',name:'Ahmed Al-Rashid',ar:'أحمد الراشد',age:29,mobile:'+966550001004',insurance:'Bupa Arabia',branch:'north'},{id:5,mrn:'MRN-0005',name:'Noura Saleh',ar:'نورة صالح',age:41,mobile:'+966550001005',insurance:'MedGulf',branch:'north'}];
var appointments=[{id:1,patient:1,doctor:1,time:'09:00',service:'General consultation',status:'Done',branch:'main'},{id:2,patient:2,doctor:2,time:'09:30',service:'Dental examination',status:'Waiting',branch:'main'},{id:3,patient:3,doctor:1,time:'10:15',service:'Pediatric consultation',status:'Confirmed',branch:'main'},{id:4,patient:4,doctor:3,time:'11:00',service:'Dermatology consult',status:'Waiting',branch:'north'},{id:5,patient:5,doctor:3,time:'11:30',service:'Follow-up',status:'Confirmed',branch:'north'}];
var invoices=[{id:'INV-1042',patient:1,amount:230,paid:230,branch:'main'},{id:'INV-1043',patient:2,amount:345,paid:0,branch:'main'},{id:'INV-1044',patient:4,amount:460,paid:200,branch:'north'}];
var notes={};
var names={en:{dashboard:'Overview',patients:'Patients',appointments:'Appointments',queue:'Waiting room',clinical:'Clinical / EMR',billing:'Billing',insurance:'Insurance',settings:'Settings',welcome:'Good morning, team',intro:'Here is what is happening at your clinic today.',newAppointment:'+ New appointment',newPatient:'+ Add patient',appointmentsToday:"Today's appointments",liveQueue:'Live patient queue',viewAll:'View all',patient:'Patient',doctor:'Doctor',time:'Time',service:'Service',status:'Status',action:'Action',checkin:'Check in',start:'Start visit',open:'Open',save:'Save draft'},ar:{dashboard:'نظرة عامة',patients:'المرضى',appointments:'المواعيد',queue:'غرفة الانتظار',clinical:'السجل الطبي',billing:'الفواتير',insurance:'التأمين',settings:'الإعدادات',welcome:'صباح الخير',intro:'إليك ما يحدث في عيادتك اليوم.',newAppointment:'+ موعد جديد',newPatient:'+ إضافة مريض',appointmentsToday:'مواعيد اليوم',liveQueue:'قائمة الانتظار',viewAll:'عرض الكل',patient:'المريض',doctor:'الطبيب',time:'الوقت',service:'الخدمة',status:'الحالة',action:'الإجراء',checkin:'تسجيل الوصول',start:'بدء الزيارة',open:'فتح',save:'حفظ المسودة'}};
var pages=[['dashboard','▦'],['patients','♙'],['appointments','▣'],['queue','◷'],['clinical','✚'],['billing','▤'],['insurance','◈'],['settings','⚙']];
var $=function(id){return document.getElementById(id)};
function safe(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(k){return names[state.language][k]||k}
function pName(id){var p=patients.find(function(p){return p.id===+id});return p?(state.language==='ar'?p.ar:p.name):'Unknown'}
function drName(id){var d=doctors.find(function(d){return d.id===+id});return d?d.name:'—'}
function aBranch(){return appointments.filter(function(a){return a.branch===state.branch})}
function pBranch(){return patients.filter(function(p){return p.branch===state.branch})}
function sar(x){return Number(x).toLocaleString('en-US')+' SAR'}
function pill(s){return '<span class="pill '+safe(s)+'">'+safe(s)+'</span>'}
function head(title,subtitle,action){return '<div class="pagehead"><div><h1>'+safe(title)+'</h1><p>'+safe(subtitle)+'</p></div>'+(action||'')+'</div>'}
function button(text,action,kind,id){return '<button class="btn '+(kind||'')+'" data-act="'+action+'"'+(id===undefined?'':' data-id="'+safe(id)+'"')+'>'+text+'</button>'}
function stat(label,value,caption,icon){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-caption">'+caption+'</div></div>'}
function rowsA(list){return list.map(function(a){var p=patients.find(function(x){return x.id===a.patient});var action=a.status==='Confirmed'?'<button class="link" data-act="checkin" data-id="'+a.id+'">'+t('checkin')+'</button>':a.status==='Waiting'?'<button class="link" data-act="visit" data-id="'+a.id+'">'+t('start')+'</button>':'<button class="link" data-act="patient" data-id="'+a.patient+'">'+t('open')+'</button>';return '<tr><td><div class="strong">'+safe(pName(a.patient))+'</div><div class="sub">'+safe(p.mrn)+'</div></td><td class="strong">'+safe(a.time)+'</td><td>'+safe(drName(a.doctor))+'</td><td>'+safe(a.service)+'</td><td>'+pill(a.status)+'</td><td>'+action+'</td></tr>'}).join('')}
function tableA(list){return '<div class="tablewrap"><table><thead><tr><th>'+t('patient')+'</th><th>'+t('time')+'</th><th>'+t('doctor')+'</th><th>'+t('service')+'</th><th>'+t('status')+'</th><th>'+t('action')+'</th></tr></thead><tbody>'+rowsA(list)+'</tbody></table>'+(list.length?'':'<div class="empty">No appointments yet</div>')+'</div>'}
function queuePanel(){var q=aBranch().filter(function(a){return a.status==='Waiting'||a.status==='Consulting'});return '<div class="panel"><div class="panel-head"><div><div class="panel-title">'+t('liveQueue')+'</div><div class="panel-sub">'+q.length+' patients in queue</div></div><button class="link" data-go="queue">'+t('viewAll')+' →</button></div>'+(q.length?q.map(function(a,i){return '<div class="queue-item"><div class="qnum">'+String(i+1).padStart(2,'0')+'</div><div class="qmain"><div class="qname">'+safe(pName(a.patient))+'</div><div class="qsub">'+safe(a.time)+' · '+safe(drName(a.doctor))+'</div></div>'+pill(a.status)+'</div>'}).join(''):'<div class="empty">Waiting room is clear</div>')+'</div>'}
function dashboard(){var a=aBranch(),inv=invoices.filter(function(i){return i.branch===state.branch});return head(t('welcome'),t('intro'),button(t('newAppointment'),'book','primary'))+'<div class="stats">'+stat('Appointments',a.length,'Scheduled today','▣')+stat('Waiting',a.filter(function(x){return x.status==='Waiting'}).length,'Checked in','◷')+stat('Completed',a.filter(function(x){return x.status==='Done'}).length,'Consultations','✓')+stat('Collected revenue',sar(inv.reduce(function(s,x){return s+x.paid},0)),'Demo payments','﷼')+'</div><div class="split"><div class="panel"><div class="panel-head"><div><div class="panel-title">'+t('appointmentsToday')+'</div><div class="panel-sub">12 November 2026 · Demo schedule</div></div><button class="link" data-go="appointments">'+t('viewAll')+' →</button></div>'+tableA(a)+'</div>'+queuePanel()+'</div><div class="panel padded"><div class="panel-title">Medical team</div>'+doctors.map(function(d){return '<span class="mini">'+safe(d.name)+' · '+safe(d.specialty)+'</span>'}).join('')+'</div>'}
function patientList(){var search=state.search.toLowerCase(),ps=pBranch().filter(function(p){return [p.name,p.ar,p.mrn,p.mobile].some(function(x){return x.toLowerCase().includes(search)})});return head('Patient directory','Search and manage fictional patient records',button(t('newPatient'),'addpatient','primary'))+'<div class="toolbar"><input class="field search" id="search" placeholder="Search name, MRN or mobile…" value="'+safe(state.search)+'"><span class="muted">'+ps.length+' patients</span></div><div class="panel tablewrap"><table><thead><tr><th>MRN</th><th>'+t('patient')+'</th><th>Age</th><th>Mobile</th><th>Insurance</th><th>'+t('action')+'</th></tr></thead><tbody>'+ps.map(function(p){return '<tr><td class="strong">'+safe(p.mrn)+'</td><td><div class="strong">'+safe(pName(p.id))+'</div><div class="sub">'+safe(state.language==='ar'?p.name:p.ar)+'</div></td><td>'+p.age+'</td><td>'+safe(p.mobile)+'</td><td>'+safe(p.insurance)+'</td><td><button class="link" data-act="patient" data-id="'+p.id+'">Open →</button></td></tr>'}).join('')+'</tbody></table>'+(ps.length?'':'<div class="empty">No matching patients</div>')+'</div>'}
function patientDetail(id){var p=patients.find(function(x){return x.id===id&&x.branch===state.branch});if(!p)return patientList();return '<button class="back" data-go="patients">← Back to patients</button>'+head(pName(p.id),p.mrn+' · '+p.age+' years')+'<div class="split"><div class="panel padded"><div class="panel-title">Patient information</div><div class="grid2" style="margin-top:20px">'+[['English name',p.name],['Arabic name',p.ar],['Age',p.age],['Mobile',p.mobile],['Insurance',p.insurance],['MRN',p.mrn]].map(function(x){return '<div><div class="label">'+x[0]+'</div><b>'+safe(x[1])+'</b></div>'}).join('')+'</div></div><div class="panel padded"><div class="panel-title">Clinical summary</div><p class="muted">Allergies: not documented</p><p class="muted">Chronic conditions: not documented</p><div style="margin-top:28px">'+button('Open clinical encounter','visitpatient','primary',p.id)+'</div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">Visit history</div></div>'+tableA(appointments.filter(function(a){return a.patient===p.id}))+'</div>'}
function appointmentScreen(){return head('Appointment schedule','Manage doctor schedules and patient check-ins',button(t('newAppointment'),'book','primary'))+'<div class="panel"><div class="panel-head"><div><div class="panel-title">Thursday, 12 November 2026</div><div class="panel-sub">Doctor view · Demo appointments</div></div></div>'+tableA(aBranch())+'</div><div class="panel padded"><div class="panel-title">Available doctors</div>'+doctors.filter(function(d){return d.branch===state.branch}).map(function(d){return '<span class="mini">'+safe(d.name)+' · '+safe(d.specialty)+'</span>'}).join('')+'</div>'}
function queueScreen(){var a=aBranch(),q=a.filter(function(x){return x.status==='Waiting'||x.status==='Consulting'});return head('Live waiting room','Move patients through the consultation workflow')+'<div class="stats">'+stat('Waiting',q.filter(function(x){return x.status==='Waiting'}).length,'Awaiting doctor','◷')+stat('With doctor',q.filter(function(x){return x.status==='Consulting'}).length,'Active encounters','✚')+stat('Completed',a.filter(function(x){return x.status==='Done'}).length,'Finished visits','✓')+stat('No-shows',0,'Demo count','—')+'</div><div class="panel"><div class="panel-head"><div class="panel-title">Patient queue</div></div>'+(q.length?q.map(function(a){return '<div class="queue-item"><div class="qnum">●</div><div class="qmain"><div class="qname">'+safe(pName(a.patient))+'</div><div class="qsub">'+safe(drName(a.doctor))+' · '+safe(a.time)+'</div></div>'+pill(a.status)+button(a.status==='Waiting'?'Call patient':'Complete visit',a.status==='Waiting'?'visit':'complete','soft',a.id)+'</div>'}).join(''):'<div class="empty">No patients waiting</div>')+'</div>'}
function clinicalScreen(){var ps=pBranch(),p=ps.find(function(x){return x.id===state.selected})||ps[0];if(!p)return head('Clinical workspace','No patients in this branch');state.selected=p.id;var n=notes[p.id]||{};var fields=[['Blood pressure','bp','120/80'],['Pulse (bpm)','pulse','76'],['Temperature (°C)','temp','36.8'],['SpO₂ (%)','spo2','98'],['Weight (kg)','weight',''],['Height (cm)','height','']];var vitals=fields.map(function(x){return '<div><label class="label">'+x[0]+'</label><input class="field" data-note="'+x[1]+'" placeholder="'+x[2]+'" value="'+safe(n[x[1]]||'')+'"></div>'}).join('');var soap=[['Subjective','subjective'],['Objective','objective'],['Assessment','assessment'],['Plan','plan']].map(function(x){return '<div style="margin-top:13px"><label class="label">'+x[0]+'</label><textarea class="field" data-note="'+x[1]+'" placeholder="Enter '+x[0].toLowerCase()+' notes">'+safe(n[x[1]]||'')+'</textarea></div>'}).join('');return head('Clinical workspace','Structured SOAP encounter · Unsigned fictional demo records')+'<div class="toolbar"><select class="field" id="clinical-patient">'+ps.map(function(x){return '<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+safe(x.name)+' · '+x.mrn+'</option>'}).join('')+'</select>'+pill('Draft')+'</div><div class="split"><div class="panel padded"><div class="panel-title">'+safe(pName(p.id))+'</div><div class="sub">'+safe(p.mrn)+' · '+p.age+' years · '+safe(p.insurance)+'</div><div class="section-title">Vital signs</div><div class="grid2">'+vitals+'</div><p class="muted" style="font-size:12px">BMI: <b id="bmi">'+(n.weight&&n.height&&+n.height>0?(+n.weight/Math.pow(+n.height/100,2)).toFixed(1):'—')+'</b></p></div><div class="panel padded"><div class="panel-title">SOAP encounter note</div>'+soap+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:17px">'+button(t('save'),'save','primary')+button('Simulate signing','sign','soft')+'</div><p class="muted" style="font-size:11px">No legal medical signature. Notes are not persisted on a server.</p></div></div>'}
function billingScreen(){var is=invoices.filter(function(i){return i.branch===state.branch});var total=is.reduce(function(s,i){return s+i.amount},0),paid=is.reduce(function(s,i){return s+i.paid},0);return head('Billing & payments','Review fictional invoices and simulate payment collection')+'<div class="stats">'+stat('Billed',sar(total),'Gross invoices','▤')+stat('Collected',sar(paid),'Payments','✓')+stat('Outstanding',sar(total-paid),'Balances','◷')+stat('Invoices',is.length,'In this branch','#')+'</div><div class="panel"><div class="panel-head"><div class="panel-title">Invoices</div></div><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Patient</th><th>Amount</th><th>Paid</th><th>Status</th><th>Action</th></tr></thead><tbody>'+is.map(function(i){return '<tr><td class="strong">'+i.id+'</td><td>'+safe(pName(i.patient))+'</td><td>'+sar(i.amount)+'</td><td>'+sar(i.paid)+'</td><td>'+pill(i.paid===i.amount?'Done':i.paid>0?'Consulting':'Waiting')+'</td><td>'+(i.paid<i.amount?'<button class="link" data-act="pay" data-id="'+i.id+'">Record payment →</button>':'Paid')+'</td></tr>'}).join('')+'</tbody></table></div></div><p class="muted" style="font-size:11px">Amounts are fictional. Saudi VAT, ZATCA, and insurance splits are not implemented in this demo.</p>'}
function insuranceScreen(){var ps=pBranch();return head('Insurance coverage','Demo policy register · Live NPHIES services disabled')+'<div class="stats">'+stat('Insured patients',ps.filter(function(p){return p.insurance!=='Self-pay'}).length,'Demo policies','◈')+stat('Carriers',3,'Configured demo names','♢')+stat('Claims',0,'None submitted','▤')+stat('Preapprovals',0,'None submitted','✓')+'</div><div class="panel"><div class="panel-head"><div class="panel-title">Insurance register</div>'+pill('NPHIES stub')+'</div><div class="tablewrap"><table><thead><tr><th>Patient</th><th>Insurance</th><th>Eligibility</th><th>Claims</th></tr></thead><tbody>'+ps.map(function(p){return '<tr><td>'+safe(pName(p.id))+'</td><td>'+safe(p.insurance)+'</td><td>'+pill('Not verified')+'</td><td>—</td></tr>'}).join('')+'</tbody></table></div></div>'}
function settingsScreen(){return head('Clinic settings','Multi-branch demo configuration')+'<div class="split"><div class="panel padded"><div class="panel-title">Branches</div>'+[['main','Riyadh Main'],['north','Riyadh North']].map(function(x){return '<div class="queue-item"><div class="qnum">⌂</div><div class="qmain"><div class="qname">'+x[1]+'</div><div class="qsub">Fictional branch</div></div><button class="btn soft" data-switch="'+x[0]+'">'+(state.branch===x[0]?'Current':'Switch')+'</button></div>'}).join('')+'</div><div class="panel padded"><div class="panel-title">Doctors & specialties</div>'+doctors.map(function(d){return '<div style="border-bottom:1px solid #eef3f3;padding:15px 0"><b>'+safe(d.name)+'</b><div class="sub">'+safe(d.specialty)+'</div></div>'}).join('')+'</div></div><div class="panel padded"><div class="panel-title">Status & limitations</div><p class="muted">Interactive UI, branch switching, language switching, appointment booking, queue workflow, patient forms, SOAP drafts and payment simulations are enabled. No authentication, audit persistence, medical data storage, secure billing, insurance integration, or production regulatory compliance is provided.</p></div>'}
function render(){document.documentElement.dir=state.language==='ar'?'rtl':'ltr';document.documentElement.lang=state.language;$('nav').innerHTML=pages.map(function(x,i){return (i===0?'<div class="navhead">WORKSPACE</div>':i===5?'<div class="navhead">MANAGEMENT</div>':'')+'<button class="nav'+(state.page===x[0]?' active':'')+'" data-go="'+x[0]+'"><span class="symbol">'+x[1]+'</span><span class="navlabel">'+t(x[0])+'</span></button>'}).join('');$('crumb').textContent=t(state.page);$('top-title').textContent=t(state.page);$('branch').value=state.branch;$('lang').textContent=state.language==='en'?'العربية':'English';$('screen').innerHTML=state.page==='dashboard'?dashboard():state.page==='patients'?(state.selected?patientDetail(state.selected):patientList()):state.page==='appointments'?appointmentScreen():state.page==='queue'?queueScreen():state.page==='clinical'?clinicalScreen():state.page==='billing'?billingScreen():state.page==='insurance'?insuranceScreen():settingsScreen()}
function toast(message){$('toastroot').innerHTML='<div class="toast">'+safe(message)+'</div>';setTimeout(function(){$('toastroot').innerHTML=''},2800)}
function closeModal(){$('modalroot').innerHTML='';window.modalSubmit=null}
function modal(title,body,label,callback){$('modalroot').innerHTML='<div class="modalwrap"><div class="modal"><div class="modalhead"><span>'+safe(title)+'</span><button class="btn" data-act="close">✕</button></div><form id="modalform">'+body+'<div class="modalactions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">'+safe(label)+'</button></div></form></div></div>';window.modalSubmit=callback}
function selectField(name,label,options){return '<div><label class="label">'+label+'</label><select class="field" name="'+name+'" required>'+options.map(function(x){return '<option value="'+safe(x[0])+'">'+safe(x[1])+'</option>'}).join('')+'</select></div>'}
function book(){var ps=pBranch(),ds=doctors.filter(function(x){return x.branch===state.branch});modal('Book appointment','<div class="grid2">'+selectField('patient','Patient',ps.map(function(p){return [p.id,p.name]}))+selectField('doctor','Doctor',ds.map(function(d){return [d.id,d.name]}))+'<div><label class="label">Time</label><input class="field" type="time" name="time" value="13:00" required></div>'+selectField('service','Service',[['General consultation','General consultation'],['Dental examination','Dental examination'],['Pediatric consultation','Pediatric consultation'],['Dermatology consult','Dermatology consult']])+'</div>','Book appointment',function(fd){var d=+fd.get('doctor'),tm=fd.get('time');if(appointments.some(function(a){return a.branch===state.branch&&a.doctor===d&&a.time===tm&&a.status!=='Cancelled'})){toast('That doctor is already booked at this time');return}appointments.push({id:Date.now(),patient:+fd.get('patient'),doctor:d,time:tm,service:fd.get('service'),branch:state.branch,status:'Confirmed'});closeModal();state.page='appointments';state.selected=null;render();toast('Appointment created in demo')})}
function addPatient(){modal('Register patient','<div class="grid2"><div><label class="label">English name</label><input class="field" name="name" required></div><div><label class="label">الاسم بالعربية</label><input class="field" name="ar" required></div><div><label class="label">Age</label><input class="field" type="number" min="0" max="120" name="age" required></div><div><label class="label">Mobile (+966)</label><input class="field" name="mobile" pattern="\\+9665[0-9]{8}" placeholder="+9665xxxxxxxx" required></div>'+selectField('insurance','Coverage',[['Self-pay','Self-pay'],['Bupa Arabia','Bupa Arabia'],['Tawuniya','Tawuniya'],['MedGulf','MedGulf']])+'</div>','Register patient',function(fd){var id=Math.max.apply(null,patients.map(function(p){return p.id}))+1;patients.push({id:id,mrn:'MRN-'+String(id).padStart(4,'0'),name:fd.get('name'),ar:fd.get('ar'),age:+fd.get('age'),mobile:fd.get('mobile'),insurance:fd.get('insurance'),branch:state.branch});state.selected=null;closeModal();render();toast('Fictional patient registered')})}
function payment(id){var i=invoices.find(function(x){return x.id===id}),due=i.amount-i.paid;modal('Record demo payment','<p>Outstanding: <b>'+sar(due)+'</b></p><div class="grid2"><div><label class="label">Amount (SAR)</label><input class="field" name="amount" type="number" min="0.01" step="0.01" max="'+due+'" value="'+due+'" required></div>'+selectField('method','Payment method',[['mada','mada / Card'],['cash','Cash'],['transfer','Bank transfer']])+'</div>','Record payment',function(fd){var n=+fd.get('amount');if(!Number.isFinite(n)||n<=0||n>due){toast('Invalid amount');return}i.paid=+(i.paid+n).toFixed(2);closeModal();render();toast('Payment recorded in demo: '+sar(n))})}
document.addEventListener('click',function(e){var n=e.target.closest('[data-go]');if(n){state.page=n.dataset.go;state.selected=null;state.search='';render();return}var b=e.target.closest('[data-switch]');if(b){state.branch=b.dataset.switch;state.selected=null;render();return}var x=e.target.closest('[data-act]');if(!x)return;var act=x.dataset.act,id=x.dataset.id;if(act==='close')closeModal();else if(act==='book')book();else if(act==='addpatient')addPatient();else if(act==='patient'){state.selected=+id;state.page='patients';render()}else if(act==='visitpatient'){state.selected=+id;state.page='clinical';render()}else if(act==='checkin'){appointments.find(function(a){return a.id===+id}).status='Waiting';render();toast('Patient checked in')}else if(act==='visit'){var a=appointments.find(function(a){return a.id===+id});a.status='Consulting';state.page='clinical';state.selected=a.patient;render();toast('Encounter opened')}else if(act==='complete'){appointments.find(function(a){return a.id===+id}).status='Done';render();toast('Visit completed')}else if(act==='pay')payment(id);else if(act==='save')toast('Clinical draft stored in this browser session only');else if(act==='sign')toast('Signing simulated only — no legal signature')});
document.addEventListener('submit',function(e){if(e.target.id==='modalform'){e.preventDefault();if(window.modalSubmit)window.modalSubmit(new FormData(e.target))}});
document.addEventListener('input',function(e){if(e.target.id==='search'){state.search=e.target.value;var pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}if(e.target.dataset.note){var id=state.selected;if(!id)return;notes[id]=notes[id]||{};notes[id][e.target.dataset.note]=e.target.value;var n=notes[id],bmi=$('bmi');if(bmi)bmi.textContent=n.weight&&n.height&&+n.height>0?(+n.weight/Math.pow(+n.height/100,2)).toFixed(1):'—'}});
$('branch').addEventListener('change',function(e){state.branch=e.target.value;state.selected=null;render()});$('lang').addEventListener('click',function(){state.language=state.language==='en'?'ar':'en';render()});document.addEventListener('change',function(e){if(e.target.id==='clinical-patient'){state.selected=+e.target.value;render()}});render();
})();
</script></body></html>
